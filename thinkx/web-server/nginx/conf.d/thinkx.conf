upstream thinkx_uwsgi {
    # Point to the uwsgi_thinkx socket
    server unix:/tmp/uwsgi_thinkx.sock;
}

server {
    listen 8005;
    server_name thinkxinc.com;

    charset utf-8;
    client_max_body_size 75M;

    location / {
        include uwsgi_params;
        uwsgi_pass thinkx_uwsgi;
    }

    # Example static file locations
    location = /favicon.ico {
      alias /src/thinkx/web-server/favicon.ico;
    }
    location = /robots.txt {
      alias /src/thinkx/web-server/robots.txt;
    }
    location = /sitemap.xml {
      alias /src/thinkx/web-server/sitemap.xml;
    }
    location /img/ {
      root /src/thinkx/web-server/views;
    }
    location /js/ {
      root /src/thinkx/web-server/views;
    }
    location /css/ {
      root /src/thinkx/web-server/views;
    }
    location /video/ {
      root /src/thinkx/web-server/views;
    }
    location /fonts/ {
      root /src/thinkx/web-server/views;
    }
    location /node_modules/ {
      root /src/thinkx/web-server/views;
    }
    location /documents/ {
      root /src/thinkx/web-server/views;
    }
}

server {
    listen 8005;
    server_name nntm.thinkxinc.com;

    charset utf-8;
    client_max_body_size 75M;

    location / {
        rewrite ^/(?!nntm)(.*)$ /nntm/$1 last;
        include uwsgi_params;
        uwsgi_pass unix:/tmp/uwsgi_thinkx.sock;
    }

    location = /nntm/favicon.ico {
        alias /src/thinkx/web-server/favicon_NNTM.ico;
    }
    location = /nntm/robots.xml {
        alias /src/thinkx/web-server/robots_NNTM.txt;
    }
    location = /nntm/sitemap.xml {
        alias /src/thinkx/web-server/sitemap_NNTM.xml;
    }

    location /nntm/img/ {
        alias /src/thinkx/web-server/views/img/;
    }
    location /nntm/js/ {
        alias /src/thinkx/web-server/views/js/;
    }
    location /nntm/css/ {
        alias /src/thinkx/web-server/views/css/;
    }
    location /nntm/video/ {
        alias /src/thinkx/web-server/views/video/;
    }
    location /nntm/fonts/ {
        alias /src/thinkx/web-server/views/fonts/;
    }
    location /nntm/node_modules/ {
        alias /src/thinkx/web-server/views/node_modules/;
    }
    location /nntm/documents/ {
        alias /src/thinkx/web-server/views/documents/;
    }


}

