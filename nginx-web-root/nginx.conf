# nginx-web-root : 旧 quantz-web/web-server/nginx/nginx.conf に対応(サイト非依存の nginx 基盤)
#
# Site configs(各サイト repo 内に置き、ここから絶対パスで include):
#    - /src/thinkx/web-server/nginx/conf.d/*.conf
#    - /src/kazukiotsukacom/web-server/nginx/conf.d/*.conf
#    - /src/transformism/web-server/nginx/conf.d/*.conf
#    ...
#
# include uwsgi_params for each site is resolved by prefix=/src/nginx-web-root
#
# Run:
#  nginx -p /src/nginx-web-root -c /src/nginx-web-root/nginx.conf
#

#user  nobody;
#worker_processes  4;

error_log stderr info;

pid /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format ltsv "time:$time_local"
                    "\thost:$remote_addr"
                    "\tforwardedfor:$http_x_forwarded_for"
                    "\treq:$request"
                    "\tstatus:$status"
                    "\tsize:$body_bytes_sent"
                    "\treferer:$http_referer"
                    "\tua:$http_user_agent"
                    "\treqtime:$request_time"
                    "\tupsttime:$upstream_response_time"
                    "\tcache:$upstream_http_x_cache"
                    "\truntime:$upstream_http_x_runtime"
                    "\tvhost:$host";
    access_log /var/log/nginx/access.log ltsv;
    error_log /var/log/nginx/error.log notice;

    sendfile        on;

    keepalive_timeout  65;

    gzip  on;
    # gzip_types を書かないと nginx は text/html しか圧縮しない(既定)。
    # これが無いまま css/js が非圧縮で流れていた(main.css 130KB・2026-07-21 実測)。
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/rss+xml image/svg+xml font/ttf font/otf;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;

    # 配信物のファイル名が固定(main.css 等)で、内容が変わっても URL が変わらない。
    # Cache-Control が無いとブラウザはヒューリスティックキャッシュを使い、古い css を
    # 数時間使い続ける。「本番に出したのに古いものが見える」が実際に起きた(2026-07-21)。
    # no-cache は「キャッシュするな」ではなく「使う前に必ず確認しろ」で、変わっていなければ
    # ETag により 304 が返るだけ。max-age を伸ばすのはファイル名にハッシュを入れてから。
    add_header Cache-Control "no-cache" always;

    # ---- 基盤共通の conf (基本は空) ----
    include /src/nginx-web-root/conf.d/*.conf;
 
    # include all site server confs (サイト追加はここに 1 行)
    # *thinkx / kazukiotsukacom の conf は各サイト repo へ移動済み。quantz-web/conf.d 側に残る同名 conf は
    #  二重定義になるため、quantz-web include を有効化する前に quantz-web 側から削除すること
    include /src/thinkx/web-server/nginx/conf.d/*.conf;
    include /src/kazukiotsukacom/web-server/nginx/conf.d/*.conf;
    include /src/transformism/web-server/nginx/conf.d/*.conf;
    include /src/podcast/web-server/nginx/conf.d/*.conf;
    ## quantz-web(8000/8002/8004)は conf.d 整理(thinkx/transformism/kazukiotsukacom の conf を削除し
    ##  自サイト分 = webserver.conf, rabbitmq.conf のみ化)のコミットと同時に有効化する
    # include /src/quantz-web/web-server/nginx/conf.d/*.conf;
}
