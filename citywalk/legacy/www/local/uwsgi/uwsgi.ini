[uwsgi]
# socket
socket = /tmp/uwsgi.sock
# pid file
pidfile = /tmp/thinkxinc.pid
#permissions for the socket file
chmod-socket = 666
# application root
chdir = ../server/application/scripts
# virtual env (relative path from application root)
venv = ../../../venv
# main.py
module = main
# flask app variable name
callable = app
# master
master = true
# maximum number of worker processes
processes = 1
# clear environment on exit
vacuum = true
# each worker will load the trained model for them self and not share with others
#lazy-apps = true
# autoreload
py-autoreload = 1
# maximum upload file size
limit-post = 70000000
# load uWSGI plugins TODO: python39
# export PYTHON=python3.9 && uwsgi --build-plugin "/usr/src/uwsgi/plugins/python python39" && mv python39_plugin.so /usr/lib/uwsgi/plugins/python39_plugin.so && chmod 644 /usr/lib/uwsgi/plugins/python39_plugin.so
#plugins-dir=/usr/lib/uwsgi/plugins/
plugins = python36
