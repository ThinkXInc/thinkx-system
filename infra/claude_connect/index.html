<style>
  /* thinkx-system/infra/claude_connect/index.html
     1ファイル・外部アセットなし・日本語のみ。共通 CSS/JS/locale は使わない(計画書 大原則4)。
     状態は /connect/state を 5 秒ごとに取って描く。接続中以外は常にボタンと入力欄を出す。 */
  :root {
    --ink: #1f2430;
    --ink-soft: #5a6170;
    --paper: #f4f2ec;
    --card: #ffffff;
    --line: #d8d3c6;
    --blue: #4f6b9e;
    --blue-deep: #3e5680;
    --green: #8fcf9f;
    --orange: #e6a06c;
    --grey: #b9b4a8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Yu Mincho", YuMincho, "Noto Serif JP", "Source Han Serif JP", serif;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
    min-height: 100vh;
    padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 440px; margin: 0 auto; }

  header { text-align: center; padding: 8px 0 18px; }
  header img { width: min(300px, 78vw); height: auto; display: block; margin: 0 auto 14px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.04em; margin: 0; }
  header p { margin: 4px 0 0; font-size: 13px; color: var(--ink-soft); letter-spacing: 0.02em; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 18px 22px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.03);
  }

  .status { display: flex; align-items: center; gap: 10px; min-height: 30px; font-size: 18px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--grey); flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); }
  .dot.connected { background: var(--green); }
  .dot.disconnected { background: var(--orange); }
  .dot.checking { background: var(--blue); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.7); } }

  .note { margin: 10px 0 0; font-size: 14px; color: var(--ink-soft); min-height: 22px; }

  /* 進行の段階表示(サーバーが返す phase に合わせて、済み・進行中・これから を切り替える) */
  .progress { margin-top: 14px; }
  .progress[hidden] { display: none; }
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { position: relative; display: flex; align-items: center; gap: 12px; padding: 7px 0; font-size: 14px; color: var(--grey); transition: color 0.4s ease; }
  .steps li + li::before { content: ""; position: absolute; left: 9px; top: -9px; width: 2px; height: 16px; background: var(--line); transition: background 0.4s ease; }
  .steps li.done + li::before { background: var(--green); }
  .steps .mark { width: 20px; height: 20px; border-radius: 50%; flex: none; box-sizing: border-box; border: 2px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; transition: background 0.4s ease, border-color 0.4s ease, transform 0.4s ease; }
  .steps li.active { color: var(--ink); }
  .steps li.active .mark { border-color: var(--blue); background: var(--blue); box-shadow: 0 0 0 0 rgba(79,107,158,0.5); animation: ring 1.4s ease-out infinite; }
  .steps li.done { color: var(--ink-soft); }
  .steps li.done .mark { border-color: var(--green); background: var(--green); transform: scale(1.05); }
  .steps li.done .mark::after { content: "✓"; color: #fff; font-weight: 700; }
  .steps li.active .mark::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  .steps .elapsed { margin-left: auto; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(79,107,158,0.55); } 100% { box-shadow: 0 0 0 10px rgba(79,107,158,0); } }

  /* 接続中に切り替わった瞬間の合図 */
  .card.done { animation: flash 1.4s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 6px rgba(143,207,159,0.9); background: #f0f8f1; } 100% { box-shadow: 0 1px 0 rgba(0,0,0,0.03); background: var(--card); } }

  .actions { margin-top: 18px; }
  .actions[hidden] { display: none; }
  .button {
    display: block; width: 100%;
    padding: 15px 16px;
    font: inherit; font-size: 17px; font-weight: 600; letter-spacing: 0.06em;
    color: #fff; background: #070707; border: 0; border-radius: 10px;
    text-align: center; text-decoration: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .button:active { background: #2a2a2a; }
  .button[aria-disabled="true"], .button:disabled { opacity: 0.55; pointer-events: none; }
  .button[hidden] { display: none; }

  .code { margin-top: 14px; }
  .code label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
  .code .row { display: flex; gap: 8px; }
  .code input {
    flex: 1; min-width: 0;
    padding: 12px 12px;
    font: inherit; font-size: 16px;
    border: 1px solid var(--line); border-radius: 10px; background: #fbfaf7; color: var(--ink);
  }
  .code input:focus { outline: 2px solid var(--blue); outline-offset: 1px; border-color: var(--blue); }
  .code button {
    padding: 0 18px;
    font: inherit; font-size: 16px; font-weight: 600;
    color: var(--blue); background: #fff; border: 1px solid var(--blue); border-radius: 10px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .code button:disabled { opacity: 0.55; }
  .error { margin: 8px 0 0; font-size: 13px; color: #a23b2c; min-height: 20px; }

  footer { margin-top: 16px; font-size: 12px; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 12px; }
  footer span { white-space: nowrap; }
</style>

    <h1>サーバーの常駐エージェントへの接続</h1>
  </header>

  <section class="card">
    <div class="status"><span class="dot checking" id="dot"></span><span id="status_text">確認中</span></div>
    <p class="note" id="note"></p>
    <div class="progress" id="progress" hidden>
      <ol class="steps" id="steps"></ol>
    </div>

    <div class="actions" id="actions" hidden>
      <button class="button" id="reconnect" type="button">セッションを再接続</button>
      <a class="button" id="open_auth" target="_blank" rel="noopener" hidden>セッションを再接続</a>
      <div class="code">
        <label for="code">認証後に表示されたコードをここに貼る</label>
        <form class="row" id="code_form" autocomplete="off">
          <input id="code" name="code" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="コード">
          <button type="submit" id="send">送信</button>
        </form>
        <p class="error" id="error"></p>
      </div>
    </div>
  </section>

  <footer><span id="disk"></span><span id="observed"></span></footer>
</main>

<script>
(function () {
  var POLL_MS = 5000;
  var dot = document.getElementById("dot");
  var statusText = document.getElementById("status_text");
  var note = document.getElementById("note");
  var actions = document.getElementById("actions");
  var reconnect = document.getElementById("reconnect");
  var openAuth = document.getElementById("open_auth");
  var form = document.getElementById("code_form");
  var codeInput = document.getElementById("code");
  var sendButton = document.getElementById("send");
  var error = document.getElementById("error");
  var disk = document.getElementById("disk");
  var observed = document.getElementById("observed");

  var card = document.querySelector(".card");
  var progress = document.getElementById("progress");
  var stepsList = document.getElementById("steps");

  var current = { state: null, url: null };
  var busy = false;
  var progressTimer = null;
  var wasConnected = null;

  // サーバーの phase(いま何をしているか)を、画面の段階に対応させる。
  // 「コードを送信」の流れと「セッションを再接続」の流れで段階が違う。
  var FLOWS = {
    code: {
      labels: ["コードを送信", "認証を確認", "セッションを起動", "接続を確認"],
      phase: { sending_code: 0, waiting_code: 1, security_notes: 2, first_run: 2, starting: 2, starting_session: 2, connected: 3 }
    },
    session: {
      labels: ["セッションを起動", "初期設定を進行", "認証画面を準備"],
      phase: { starting_session: 0, starting: 0, first_run: 1, waiting_code: 2, url_ready: 2, security_notes: 1, connected: 2 }
    }
  };
  var flow = null;
  var activeIndex = 0;
  var started = 0;

  function setStatus(kind, text, noteText) {
    dot.className = "dot " + kind;
    statusText.textContent = text;
    note.textContent = noteText || "";
  }

  function drawSteps() {
    var items = stepsList.children;
    for (var i = 0; i < items.length; i++) {
      items[i].className = i < activeIndex ? "done" : (i === activeIndex ? "active" : "");
    }
    var elapsed = stepsList.querySelector(".elapsed");
    if (elapsed) elapsed.textContent = Math.round((Date.now() - started) / 1000) + " 秒";
  }

  function advanceTo(index) {
    if (index > activeIndex) { activeIndex = index; drawSteps(); }
  }

  // 送信〜接続中になるまで、サーバーの phase を 1 秒ごとに読み、段階を進めて見せる
  function startProgress(kind) {
    flow = FLOWS[kind];
    activeIndex = 0;
    started = Date.now();
    stepsList.innerHTML = "";
    flow.labels.forEach(function (label, i) {
      var li = document.createElement("li");
      var mark = document.createElement("span"); mark.className = "mark";
      var text = document.createElement("span"); text.textContent = label;
      li.appendChild(mark); li.appendChild(text);
      if (i === 0) { var el = document.createElement("span"); el.className = "elapsed"; li.appendChild(el); }
      stepsList.appendChild(li);
    });
    // 経過秒は最初の行でなく、進行中の行に付ける
    drawSteps();
    progress.hidden = false;
    clearInterval(progressTimer);
    progressTimer = setInterval(function () {
      fetch("/connect/state", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var idx = flow.phase[d.phase];
          if (idx !== undefined) advanceTo(idx);
          moveElapsed();
          drawSteps();
        })
        .catch(function () { drawSteps(); });
    }, 1000);
  }

  function moveElapsed() {
    var el = stepsList.querySelector(".elapsed");
    var target = stepsList.children[Math.min(activeIndex, stepsList.children.length - 1)];
    if (el && target && el.parentNode !== target) target.appendChild(el);
  }

  // 残りの段階を順に「済み」にしてから閉じる(突然切り替わらないように 1 段ずつ)
  function finishProgress(done) {
    clearInterval(progressTimer);
    progressTimer = null;
    var total = stepsList.children.length;
    var step = function () {
      if (activeIndex < total) {
        activeIndex += 1;
        moveElapsed();
        drawSteps();
        setTimeout(step, 350);
      } else {
        setTimeout(function () { progress.hidden = true; done(); }, 500);
      }
    };
    step();
  }

  function stopProgress() {
    clearInterval(progressTimer);
    progressTimer = null;
    progress.hidden = true;
  }

  function celebrate() {
    card.classList.remove("done");
    void card.offsetWidth;
    card.classList.add("done");
  }

  function render(data) {
    current = data;
    disk.textContent = (data.disk_free_gb !== undefined && data.disk_free_gb !== null) ? "空き容量 " + data.disk_free_gb + " GB" : "";
    observed.textContent = data.observed_at ? "確認 " + data.observed_at.replace("T", " ").replace(/\+00:00$/, " UTC") : "";
    if (busy) return;

    if (data.state === "connected") {
      setStatus("connected", "接続中", "Claude アプリのセッション一覧から開いてください");
      actions.hidden = true;
      stopProgress();
      if (wasConnected === false) celebrate();
      wasConnected = true;
      return;
    }
    wasConnected = false;
    actions.hidden = false;
    // URL が分かっているときは、同じ位置・同じ見た目の本物のリンクにする(タップで別タブに認証画面。
    // 空タブを先に開いて後から URL を入れる方式は iPhone Safari で元ページの処理が止まり動かなかった)。
    if (data.state === "login_required" && data.url) {
      openAuth.href = data.url;
      openAuth.hidden = false;
      reconnect.hidden = true;
      setStatus("disconnected", "接続されていません", "ボタンを押すと認証画面が別タブで開きます。認証後に表示されたコードを下に貼ってください");
    } else {
      openAuth.hidden = true;
      reconnect.hidden = false;
      setStatus("disconnected", "接続されていません", "");
    }
  }

  function poll() {
    fetch("/connect/state", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(render)
      .catch(function () { if (!busy) setStatus("checking", "確認中", "サーバーに届きません。少し待って再読み込みしてください"); });
  }

  function post(path, body) {
    return fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ("HTTP " + r.status)); return j; }); });
  }

  reconnect.addEventListener("click", function (ev) {
    ev.preventDefault();
    if (busy) return;
    error.textContent = "";

    busy = true;
    reconnect.setAttribute("aria-disabled", "true");
    setStatus("checking", "確認中", "セッションを立て直しています");
    startProgress("session");
    post("/connect/session")
      .then(function (data) {
        finishProgress(function () {
          busy = false;
          reconnect.removeAttribute("aria-disabled");
          render(data);
          if (data.url) note.textContent = "もう一度「セッションを再接続」を押すと認証画面が別タブで開きます。認証後に表示されたコードを下に貼ってください";
        });
      })
      .catch(function (e) {
        busy = false;
        reconnect.removeAttribute("aria-disabled");
        stopProgress();
        error.textContent = e.message;
        poll();
      });
  });

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (busy) return;
    var code = codeInput.value.trim();
    error.textContent = "";
    if (!code) { error.textContent = "コードを貼ってください"; return; }
    busy = true;
    sendButton.disabled = true;
    codeInput.disabled = true;
    setStatus("checking", "確認中", "コードを送りました");
    startProgress("code");
    post("/connect/code", { code: code })
      .then(function (data) {
        var finish = data.state === "connected" ? finishProgress : function (cb) { stopProgress(); cb(); };
        finish(function () {
          busy = false;
          sendButton.disabled = false;
          codeInput.disabled = false;
          codeInput.value = "";
          render(data);
          if (data.state !== "connected") error.textContent = "まだ接続中になっていません。コードが違う場合は「セッションを再接続」からやり直してください";
        });
      })
      .catch(function (e) {
        busy = false;
        sendButton.disabled = false;
        codeInput.disabled = false;
        stopProgress();
        error.textContent = e.message;
        poll();
      });
  });

  poll();
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
