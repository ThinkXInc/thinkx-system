<style>
  /* thinkx-system/infra/claude_connect/index.html
     1ファイル・外部アセットなし・日本語のみ。共通 CSS/JS/locale は使わない(計画書 大原則4)。
     状態は /connect/state を 5 秒ごとに取って描く。接続中以外は常にボタンと入力欄を出す。 */
  :root {
    --ink: #1f2430;
    --ink-soft: #5a6170;
    --paper: #f4f2ec;
    --card: #ffffff;
    --line: #d8d3c6;
    --blue: #4f6b9e;
    --blue-deep: #3e5680;
    --green: #8fcf9f;
    --orange: #e6a06c;
    --grey: #b9b4a8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Yu Mincho", YuMincho, "Noto Serif JP", "Source Han Serif JP", serif;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
    min-height: 100vh;
    padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 440px; margin: 0 auto; }

  header { text-align: center; padding: 8px 0 18px; }
  header img { width: min(300px, 78vw); height: auto; display: block; margin: 0 auto; }
  header .product-name { margin: 14px 0 0 0; text-align: center; font-size: 15px; font-weight: 700; color: var(--ink); letter-spacing: .01em; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.04em; margin: 0; }
  header p { margin: 4px 0 0; font-size: 13px; color: var(--ink-soft); letter-spacing: 0.02em; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 18px 22px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.03);
  }

  .status { display: flex; align-items: center; gap: 10px; min-height: 30px; font-size: 18px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--grey); flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); }
  .dot.connected { background: var(--green); }
  .dot.disconnected { background: var(--orange); }
  .dot.checking { background: var(--blue); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.7); } }

  .note { margin: 10px 0 0; font-size: 14px; color: var(--ink-soft); min-height: 22px; }
  .note[hidden], .note:empty { display: none; }

  /* 進行の段階表示(サーバーが返す phase に合わせて、済み・進行中・これから を切り替える) */
  .progress { margin-top: 14px; }
  .progress[hidden] { display: none; }
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { position: relative; display: flex; align-items: center; gap: 12px; padding: 7px 0; font-size: 14px; color: var(--grey); transition: color 0.4s ease; }
  .steps li + li::before { content: ""; position: absolute; left: 9px; top: -9px; width: 2px; height: 16px; background: var(--line); transition: background 0.4s ease; }
  .steps li.done + li::before { background: var(--green); }
  .steps .mark { width: 20px; height: 20px; border-radius: 50%; flex: none; box-sizing: border-box; border: 2px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; transition: background 0.4s ease, border-color 0.4s ease, transform 0.4s ease; }
  .steps li.active { color: var(--ink); }
  .steps li.active .mark { border-color: var(--blue); background: var(--blue); box-shadow: 0 0 0 0 rgba(79,107,158,0.5); animation: ring 1.4s ease-out infinite; }
  .steps li.done { color: var(--ink-soft); }
  .steps li.done .mark { border-color: var(--green); background: var(--green); transform: scale(1.05); }
  .steps li.done .mark::after { content: "✓"; color: #fff; font-weight: 700; }
  .steps li.active .mark::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  .steps .elapsed { margin-left: auto; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(79,107,158,0.55); } 100% { box-shadow: 0 0 0 10px rgba(79,107,158,0); } }

  /* 接続中に切り替わった瞬間の合図 */
  .card.done { animation: flash 1.4s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 6px rgba(143,207,159,0.9); background: #f0f8f1; } 100% { box-shadow: 0 1px 0 rgba(0,0,0,0.03); background: var(--card); } }

  .actions { margin-top: 18px; }
  .actions[hidden] { display: none; }
  .button {
    display: block; width: 100%;
    padding: 15px 16px;
    font: inherit; font-size: 17px; font-weight: 600; letter-spacing: 0.06em;
    color: #fff; background: #070707; border: 0; border-radius: 10px;
    text-align: center; text-decoration: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .button:active { background: #2a2a2a; }
  .button[aria-disabled="true"], .button:disabled { opacity: 0.55; pointer-events: none; }
  .button[hidden] { display: none; }
  .button.open { margin-top: 16px; }

  .code { margin-top: 14px; }
  .code label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
  .code .row { display: flex; gap: 8px; }
  .code input {
    flex: 1; min-width: 0;
    padding: 12px 12px;
    font: inherit; font-size: 16px;
    border: 1px solid var(--line); border-radius: 10px; background: #fbfaf7; color: var(--ink);
  }
  .code input:focus { outline: 2px solid var(--blue); outline-offset: 1px; border-color: var(--blue); }
  .code button {
    padding: 0 18px;
    font: inherit; font-size: 16px; font-weight: 600;
    color: var(--blue); background: #fff; border: 1px solid var(--blue); border-radius: 10px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .code button:disabled { opacity: 0.55; }
  .error { margin: 8px 0 0; font-size: 13px; color: #a23b2c; }
  .error:empty { display: none; }

  /* staging の電源(本番の入口でだけ出る。電源 API が 404 なら隠す) */
  .card.power { margin-bottom: 16px; }
  .card.power h2 { font-size: 16px; font-weight: 600; letter-spacing: 0.04em; margin: 0 0 8px; }
  .card.power .button { margin-top: 14px; }
  .note.offline { text-align: center; margin: 4px 0 0; }
  .note.offline[hidden] { display: none; }
  .card[hidden] { display: none; }

  /* 下段。左: 本番への反映(押す=承認・主要)。右下: Claude の更新(重要度低・控えめな白ボタン) */
  .bottom { margin-top: 16px; display: flex; gap: 16px; align-items: stretch; }
  .card.deploy { width: 50%; flex: none; box-sizing: border-box; }
  .card.deploy h2 { font-size: 16px; font-weight: 600; letter-spacing: 0.04em; margin: 0; }
  .card.deploy .note { margin-top: 6px; }
  .card.deploy > .button { margin-top: 14px; }
  .update-side { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; font-size: 12px; color: var(--ink-soft); text-align: right; }
  .update-side .button.quiet { width: auto; margin: 8px 0 0; padding: 10px 16px; font-size: 14px; }
  .update-side .row { display: flex; gap: 8px; justify-content: flex-end; }
  .update-side[hidden] { display: none; }
  .button.quiet { color: var(--ink); background: #fff; border: 1px solid var(--line); }
  .button.quiet:active { background: #f1efe9; }
  .confirm { margin-top: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fbfaf7; }
  .confirm[hidden] { display: none; }
  .confirm .summary { margin: 0; font-size: 14px; }
  .confirm .commits { margin: 8px 0 0; padding-left: 18px; font-size: 12px; color: var(--ink-soft); max-height: 120px; overflow: auto; }
  .confirm .row { display: flex; gap: 8px; margin-top: 12px; }
  .confirm .row .button { margin: 0; }

  footer { margin-top: 16px; font-size: 12px; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 12px; }
  footer span { white-space: nowrap; }
</style>
</head>

    <div class="status"><span class="dot checking" id="dot"></span><span id="status_text">確認中</span></div>
    <p class="note" id="note"></p>
    <div class="progress" id="progress" hidden>
      <ol class="steps" id="steps"></ol>
    </div>

    <a class="button open" id="open_claude" target="_blank" rel="noopener" hidden>Claude を開く</a>

    <div class="actions" id="actions" hidden>
      <button class="button" id="reconnect" type="button">セッションを再接続</button>
      <a class="button" id="open_auth" target="_blank" rel="noopener" hidden>セッションを再接続</a>
      <div class="code">
        <label for="code">認証後に表示されたコードをここに貼る</label>
        <form class="row" id="code_form" autocomplete="off">
          <input id="code" name="code" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="コード">
          <button type="submit" id="send">送信</button>
        </form>
        <p class="error" id="error"></p>
      </div>
    </div>
  </section>

  <div class="bottom">
  <section class="card deploy" id="deploy_card">
    <h2>本番への反映</h2>
    <p class="note" id="deploy_note">staging で確認した内容を、そのまま本番に出します</p>
    <div class="progress" id="deploy_progress" hidden>
      <ol class="steps" id="deploy_steps"></ol>
    </div>
    <div class="confirm" id="deploy_confirm" hidden>
      <p class="summary" id="deploy_summary"></p>
      <ul class="commits" id="deploy_commits"></ul>
      <div class="row">
        <button class="button" id="deploy_go" type="button">本番に反映する</button>
        <button class="button quiet" id="deploy_cancel" type="button">やめる</button>
      </div>
    </div>
    <button class="button" id="deploy" type="button">本番に反映</button>
    <a class="button open" id="open_production" href="https://thinkxinc.com/" target="_blank" rel="noopener" hidden>本番を開く</a>
    <p class="error" id="deploy_error"></p>
  </section>

  <div class="update-side" id="update_line">
    <span id="update_info"></span>
    <span class="row">
      <button class="button quiet" id="update_go" type="button" hidden>実行</button>
      <button class="button quiet" id="update_cancel" type="button" hidden>やめる</button>
    </span>
    <button class="button quiet" id="update_stop" type="button" hidden>staging を停止</button>
    <button class="button quiet" id="update_check" type="button">Claudeをアップデート</button>
  </div>
  </div>

  <footer><span id="disk"></span><span id="observed"></span></footer>
</main>

<script>
(function () {
  var POLL_MS = 5000;
  var POLL_GIVEUP = 5;  // 連続失敗の上限。開きっぱなしのタブが永久に叩き続けない(2026-09-18 障害: 停止中の staging への中継が本番を塞いだ)
  var dot = document.getElementById("dot");
  var recheck = document.getElementById("recheck");
  var statusText = document.getElementById("status_text");
  var note = document.getElementById("note");
  var actions = document.getElementById("actions");
  var reconnect = document.getElementById("reconnect");
  var openAuth = document.getElementById("open_auth");
  var openClaude = document.getElementById("open_claude");
  var form = document.getElementById("code_form");
  var codeInput = document.getElementById("code");
  var sendButton = document.getElementById("send");
  var error = document.getElementById("error");
  var disk = document.getElementById("disk");
  var observed = document.getElementById("observed");

  var card = document.querySelector(".card");
  var progress = document.getElementById("progress");
  var stepsList = document.getElementById("steps");

  var current = { state: null, url: null };
  var busy = false;
  var progressTimer = null;
  var wasConnected = null;

  // サーバーの phase(いま何をしているか)を、画面の段階に対応させる。
  // 「コードを送信」の流れと「セッションを再接続」の流れで段階が違う。
  var FLOWS = {
    code: {
      host: "progress", list: "steps",
      labels: ["コードを送信", "認証を確認", "セッションを起動", "接続を確認"],
      phase: { sending_code: 0, waiting_code: 1, security_notes: 2, first_run: 2, starting: 2, starting_session: 2, connected: 3 }
    },
    session: {
      host: "progress", list: "steps",
      labels: ["セッションを起動", "初期設定を進行", "認証画面を準備"],
      phase: { starting_session: 0, starting: 0, first_run: 1, waiting_code: 2, url_ready: 2, security_notes: 1, connected: 2 }
    },
    deploy: {
      host: "deploy_progress", list: "deploy_steps",
      labels: ["内容を確認", "release を作成", "production へ送信", "本番サーバーが取り込み(約 60 秒)", "本番の応答を確認"],
      phase: { deploy_fetch: 0, deploy_release: 1, deploy_push: 2, deploy_wait: 3, deploy_check: 4 },
      doneWhen: function (d) { return d.deploy && !d.deploy.running && (d.deploy.result || d.deploy.error); }
    },
    power_on: {
      host: "power_progress", list: "power_steps", source: "power/state",
      labels: ["起動を要求", "起動中", "サービスの起動を待つ(2〜3 分)", "準備完了"],
      phase: { pending: 0, running: 1, reachable: 3 },
      phaseOf: function (d) { return d.reachable ? "reachable" : (d.state === "running" ? "running" : d.state); },
      doneWhen: function (d) { return d.reachable; }
    },
    power_off: {
      host: "power_progress", list: "power_steps", source: "power/state",
      labels: ["停止を要求", "停止中", "停止完了"],
      phase: { stopping: 0, stopped: 2 },
      phaseOf: function (d) { return d.state; },
      doneWhen: function (d) { return d.state === "stopped"; }
    }
  };
  var progressDone = null;
  var flow = null;
  var activeIndex = 0;
  var started = 0;

  function setStatus(kind, text, noteText) {
    dot.className = "dot " + kind;
    statusText.textContent = text;
    note.textContent = noteText || "";
    note.hidden = !noteText;  // 空のときは行ごと消して間を詰める
  }

  function drawSteps() {
    var items = stepsList.children;
    for (var i = 0; i < items.length; i++) {
      items[i].className = i < activeIndex ? "done" : (i === activeIndex ? "active" : "");
    }
    var elapsed = stepsList.querySelector(".elapsed");
    if (elapsed) elapsed.textContent = Math.round((Date.now() - started) / 1000) + " 秒";
  }

  function advanceTo(index) {
    if (index > activeIndex) { activeIndex = index; drawSteps(); }
  }

  // 送信〜接続中になるまで、サーバーの phase を 1 秒ごとに読み、段階を進めて見せる
  function startProgress(kind, onDone) {
    flow = FLOWS[kind];
    progressDone = onDone || null;
    progress = document.getElementById(flow.host);
    stepsList = document.getElementById(flow.list);
    activeIndex = 0;
    started = Date.now();
    stepsList.innerHTML = "";
    flow.labels.forEach(function (label, i) {
      var li = document.createElement("li");
      var mark = document.createElement("span"); mark.className = "mark";
      var text = document.createElement("span"); text.textContent = label;
      li.appendChild(mark); li.appendChild(text);
      if (i === 0) { var el = document.createElement("span"); el.className = "elapsed"; li.appendChild(el); }
      stepsList.appendChild(li);
    });
    // 経過秒は最初の行でなく、進行中の行に付ける
    drawSteps();
    progress.hidden = false;
    clearInterval(progressTimer);
    var inFlight = false;
    progressTimer = setInterval(function () {
      drawSteps();
      if (inFlight) return;  // 前の問い合わせが返るまで重ねない(本番の Flask は同時に 1 件しか捌けない)
      inFlight = true;
      fetch(flow.source || "state", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var key = flow.phaseOf ? flow.phaseOf(d) : d.phase;
          var idx = flow.phase[key];
          if (idx !== undefined) advanceTo(idx);
          moveElapsed();
          drawSteps();
          if (flow.doneWhen && flow.doneWhen(d) && progressDone) { var cb = progressDone; progressDone = null; finishProgress(function () { cb(d); }); }
        })
        .catch(function () { drawSteps(); })
        .then(function () { inFlight = false; });
    }, 1000);
  }

  function moveElapsed() {
    var el = stepsList.querySelector(".elapsed");
    var target = stepsList.children[Math.min(activeIndex, stepsList.children.length - 1)];
    if (el && target && el.parentNode !== target) target.appendChild(el);
  }

  // 残りの段階を順に「済み」にしてから閉じる(突然切り替わらないように 1 段ずつ)
  function finishProgress(done) {
    clearInterval(progressTimer);
    progressTimer = null;
    var total = stepsList.children.length;
    var step = function () {
      if (activeIndex < total) {
        activeIndex += 1;
        moveElapsed();
        drawSteps();
        setTimeout(step, 350);
      } else {
        setTimeout(function () { progress.hidden = true; done(); }, 500);
      }
    };
    step();
  }

  function stopProgress() {
    clearInterval(progressTimer);
    progressTimer = null;
    progress.hidden = true;
  }

  function celebrate() {
    card.classList.remove("done");
    void card.offsetWidth;
    card.classList.add("done");
  }

  function render(data) {
    current = data;
    disk.textContent = (data.disk_free_gb !== undefined && data.disk_free_gb !== null) ? "空き容量 " + data.disk_free_gb + " GB" : "";
    observed.textContent = data.observed_at ? "確認 " + data.observed_at.replace("T", " ").replace(/\+00:00$/, " UTC") : "";
    if (busy) return;

    if (data.state === "connected") {
      // セッションの URL が拾えていれば、そのままチャット画面へ飛べるリンクを出す(リモコン化の第一歩)。
      // 起動直後は URL が十数秒遅れて出るので、ボタンは最初から出して押せなくしておき、
      // URL が出たら有効にする(隠すと「ボタンが消えた」に見える・オーナー指示 2026-09-18)
      if (data.session_url) {
        setStatus("connected", "接続中", "");
        openClaude.href = data.session_url;
        openClaude.removeAttribute("aria-disabled");
        openClaude.hidden = false;
      } else if (urlWaits < POLL_GIVEUP) {
        setStatus("connected", "接続中", "セッションの URL を準備しています。準備ができるとこのボタンが押せるようになります(十数秒)");
        openClaude.removeAttribute("href");
        openClaude.setAttribute("aria-disabled", "true");
        openClaude.hidden = false;
      } else {
        setStatus("connected", "接続中", "Claude アプリのセッション一覧から開いてください");
        openClaude.hidden = true;
      }
      actions.hidden = true;
      if (!deployBusy) stopProgress();  // 本番反映の段階表示を 5 秒ごとの状態更新で消さない
      if (wasConnected === false) celebrate();
      wasConnected = true;
      return;
    }
    wasConnected = false;
    openClaude.hidden = true;
    actions.hidden = false;
    // URL が分かっているときは、同じ位置・同じ見た目の本物のリンクにする(タップで別タブに認証画面。
    // 空タブを先に開いて後から URL を入れる方式は iPhone Safari で元ページの処理が止まり動かなかった)。
    if (data.state === "login_required" && data.url) {
      openAuth.href = data.url;
      openAuth.hidden = false;
      reconnect.hidden = true;
      setStatus("disconnected", "接続されていません", "ボタンを押すと認証画面が別タブで開きます。認証後に表示されたコードを下に貼ってください");
    } else {
      openAuth.hidden = true;
      reconnect.hidden = false;
      setStatus("disconnected", "接続されていません", "");
    }
  }

  // state は答えが出たら止まる: 取れたら表示して終了、503(staging 停止)も答えなので終了。
  // 取れないときだけ POLL_MS 間隔で追い、連続 POLL_GIVEUP 回で諦めて再確認ボタンに切り替える。
  // 例外: 起動直後は connected でもセッション URL が十数秒遅れて出る(claude が sessions ファイルを
  // 書くまで)。URL が無い間だけ POLL_GIVEUP 回を上限に追い、出たら止まる(2026-09-18)。
  var pollTimer = null;
  var pollFails = 0;
  var urlWaits = 0;

  function refreshState() {
    clearTimeout(pollTimer);
    pollTimer = null;
    pollFails = 0;
    urlWaits = 0;
    recheck.hidden = true;
    poll();
  }

  function poll() {
    fetch("state", { cache: "no-store" })
      .then(function (r) {
        if (r.status === 503 && powerAvailable) { setOffline(true); return null; }
        setOffline(false);
        return r.json();
      })
      .then(function (d) {
        if (d) render(d);
        pollFails = 0;
        recheck.hidden = true;
        if (d && d.state === "connected" && !d.session_url && urlWaits < POLL_GIVEUP) {
          urlWaits += 1;
          pollTimer = setTimeout(poll, POLL_MS);
        } else {
          urlWaits = 0;
        }
      })
      .catch(function () {
        pollFails += 1;
        if (pollFails >= POLL_GIVEUP) {
          if (!busy) setStatus("disconnected", "状態を取得できませんでした", "サーバーが停止しているか、応答がありません");
          recheck.hidden = false;
          return;
        }
        if (!busy) setStatus("checking", "確認中", "サーバーに届きません(" + pollFails + "/" + POLL_GIVEUP + ")");
        pollTimer = setTimeout(poll, POLL_MS);
      });
  }

  function post(path, body) {
    return fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ("HTTP " + r.status)); return j; }); });
  }

  reconnect.addEventListener("click", function (ev) {
    ev.preventDefault();
    if (busy) return;
    error.textContent = "";

    busy = true;
    reconnect.setAttribute("aria-disabled", "true");
    setStatus("checking", "確認中", "セッションを立て直しています");
    startProgress("session");
    post("session")
      .then(function (data) {
        finishProgress(function () {
          busy = false;
          reconnect.removeAttribute("aria-disabled");
          render(data);
          if (data.state === "connected" && !data.session_url) refreshState();
          if (data.url) note.textContent = "もう一度「セッションを再接続」を押すと認証画面が別タブで開きます。認証後に表示されたコードを下に貼ってください";
        });
      })
      .catch(function (e) {
        busy = false;
        reconnect.removeAttribute("aria-disabled");
        stopProgress();
        error.textContent = e.message;
        refreshState();
      });
  });

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (busy) return;
    var code = codeInput.value.trim();
    error.textContent = "";
    if (!code) { error.textContent = "コードを貼ってください"; return; }
    busy = true;
    sendButton.disabled = true;
    codeInput.disabled = true;
    setStatus("checking", "確認中", "コードを送りました");
    startProgress("code");
    post("code", { code: code })
      .then(function (data) {
        var finish = data.state === "connected" ? finishProgress : function (cb) { stopProgress(); cb(); };
        finish(function () {
          busy = false;
          sendButton.disabled = false;
          codeInput.disabled = false;
          codeInput.value = "";
          render(data);
          if (data.state === "connected" && !data.session_url) refreshState();
          if (data.state !== "connected") error.textContent = "まだ接続中になっていません。コードが違う場合は「セッションを再接続」からやり直してください";
        });
      })
      .catch(function (e) {
        busy = false;
        sendButton.disabled = false;
        codeInput.disabled = false;
        stopProgress();
        error.textContent = e.message;
        refreshState();
      });
  });

  // ---- 本番への反映(押す=承認) ----
  var deployCard = document.getElementById("deploy_card");
  var deployNote = document.getElementById("deploy_note");
  var deployButton = document.getElementById("deploy");
  var deployConfirm = document.getElementById("deploy_confirm");
  var deploySummary = document.getElementById("deploy_summary");
  var deployCommits = document.getElementById("deploy_commits");
  var deployGo = document.getElementById("deploy_go");
  var deployCancel = document.getElementById("deploy_cancel");
  var deployError = document.getElementById("deploy_error");
  var openProduction = document.getElementById("open_production");
  var deployBusy = false;

  function resetDeploy(noteText) {
    deployConfirm.hidden = true;
    deployButton.hidden = false;
    deployButton.disabled = false;
    deployNote.textContent = noteText || "staging で確認した内容を、そのまま本番に出します";
  }

  // 1 回目: 何が出るかを取って見せる(まだ何も変えない)。2 回目(本番に反映する)が承認。
  deployButton.addEventListener("click", function () {
    if (deployBusy) return;
    deployError.textContent = "";
    deployButton.disabled = true;
    deployNote.textContent = "本番との差を調べています";
    fetch("deploy", { cache: "no-store" })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ("HTTP " + r.status)); return j; }); })
      .then(function (p) {
        deployButton.disabled = false;
        if (p.same) {
          resetDeploy("本番は staging と同じ内容です。反映するものはありません");
          openProduction.hidden = false;
          return;
        }
        deploySummary.textContent = p.commits.length + " 件の変更を本番に出します" +
          (p.services.length ? "。再起動: " + p.services.join(", ") : "。再起動するサービスはありません");
        deployCommits.innerHTML = "";
        p.commits.forEach(function (line) { var li = document.createElement("li"); li.textContent = line; deployCommits.appendChild(li); });
        deployButton.hidden = true;
        deployConfirm.hidden = false;
        deployNote.textContent = "内容を確認して「本番に反映する」を押してください。押した時点が承認です";
      })
      .catch(function (e) { deployButton.disabled = false; deployError.textContent = e.message; });
  });

  deployCancel.addEventListener("click", function () { resetDeploy(); });

  deployGo.addEventListener("click", function () {
    if (deployBusy) return;
    deployBusy = true;
    deployConfirm.hidden = true;
    openProduction.hidden = true;
    deployNote.textContent = "本番に反映しています";
    // POST は受け付け(202)で即返る。完了はサーバーの state.deploy(running が false・result か error あり)で判断する
    startProgress("deploy", function (d) {
      var job = d.deploy || {};
      var r = job.result || {};
      deployBusy = false;
      deployCard.classList.remove("done"); void deployCard.offsetWidth; deployCard.classList.add("done");
      if (job.error) { resetDeploy(); deployError.textContent = job.error; return; }
      if (r.result === "already") {
        resetDeploy("本番は staging と同じ内容でした。反映するものはありません");
      } else {
        resetDeploy(r.release + " を本番に出しました。本番の応答: " + (r.production_http === 200 ? "正常(200)" : "確認できません(" + r.production_http + ")。少し待って本番を開いてください"));
      }
      openProduction.hidden = false;
    });
    post("deploy")
      .catch(function (e) {
        stopProgress();
        deployBusy = false;
        resetDeploy();
        deployError.textContent = e.message;
      });
  });

  // ---- Claude の更新(重要度低・右下の小さな文字。オーナー指示 2026-09-28) ----
  // 1 回目: 今の版と最新版を見せるだけ(まだ何も変えない)。2 回目(実行)が更新。
  var updateLine = document.getElementById("update_line");
  var updateInfo = document.getElementById("update_info");
  var updateButton = document.getElementById("update_check");
  var updateGo = document.getElementById("update_go");
  var updateCancel = document.getElementById("update_cancel");
  var updateStop = document.getElementById("update_stop");
  var updateTimer = null;

  function resetUpdate(infoText) {
    clearInterval(updateTimer);
    updateTimer = null;
    updateGo.hidden = true;
    updateCancel.hidden = true;
    updateStop.hidden = true;
    updateButton.hidden = false;
    updateButton.disabled = false;
    updateInfo.textContent = infoText || "";
  }

  updateButton.addEventListener("click", function () {
    updateButton.disabled = true;
    updateInfo.textContent = "版を調べています…";
    fetch("update", { cache: "no-store" })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ("HTTP " + r.status)); return j; }); })
      .then(function (p) {
        if (p.same) {
          resetUpdate("最新です(" + p.current + ")");
          return;
        }
        updateInfo.textContent = p.current + " → " + p.latest;
        updateButton.hidden = true;
        updateButton.disabled = false;
        updateGo.hidden = false;
        updateCancel.hidden = false;
      })
      .catch(function (e) { resetUpdate(e.message); });
  });

  updateCancel.addEventListener("click", function () { resetUpdate(); });

  updateGo.addEventListener("click", function () {
    updateGo.hidden = true;
    updateCancel.hidden = true;
    var updateStarted = Date.now();
    updateInfo.textContent = "更新しています…";
    // POST は受け付け(202)で即返る。完了はサーバーの state.update(running が false・result か error あり)で見る
    var updateInFlight = false;
    updateTimer = setInterval(function () {
      updateInfo.textContent = "更新しています(" + Math.round((Date.now() - updateStarted) / 1000) + " 秒)…";
      if (updateInFlight) return;
      updateInFlight = true;
      fetch("state", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var job = d.update || {};
          if (job.running || !(job.result || job.error)) return;
          if (job.error) { resetUpdate(job.error); return; }
          var r = job.result;
          if (r.result === "already") {
            resetUpdate("すでに最新でした(" + r.after + ")");
            return;
          }
          // 動作中のセッションは旧版のまま。反映は staging の停止→起動(電源カードと同じ操作)で行う。
          // 電源が使える入口では、直後の操作は「staging を停止」だけにする(更新ボタンは引っ込める)
          resetUpdate(r.before + " → " + r.after + " に更新しました。staging を停止→起動すると反映されます");
          if (powerAvailable === true) {
            updateStop.hidden = false;
            updateButton.hidden = true;
          }
        })
        .catch(function () {})
        .then(function () { updateInFlight = false; });
    }, 2000);
    post("update").catch(function (e) { resetUpdate(e.message); });
  });

  updateStop.addEventListener("click", function () {
    resetUpdate();  // 次に staging が起動して戻ってきたときは通常の「Claudeをアップデート」に戻す
    powerStop.click();  // 電源カードの「staging を停止」と同じ操作(進行は電源カードに出る)
  });

  // ---- staging の電源(本番の入口 /remote_control/ でだけ。staging 直開きでは power/state が 404 なので隠れる) ----
  var powerCard = document.getElementById("power_card");
  var powerDot = document.getElementById("power_dot");
  var powerText = document.getElementById("power_text");
  var powerNote = document.getElementById("power_note");
  var powerStart = document.getElementById("power_start");
  var powerStop = document.getElementById("power_stop");
  var powerError = document.getElementById("power_error");
  var connectCard = document.getElementById("connect_card");
  var offlineNote = document.getElementById("offline_note");
  var powerAvailable = null;   // null = 未確認 / false = 電源 API なし(staging 直開き) / true = あり(本番の入口)
  var powerBusy = false;
  var offline = false;

  function setOffline(on) {
    if (on === offline) return;
    offline = on;
    connectCard.hidden = on;
    deployCard.hidden = on;
    updateLine.hidden = on;
    offlineNote.hidden = !on;
    if (on) recheck.hidden = true;  // 「停止中」は答えが出た状態。再確認ではなく電源カードの起動で戻す
    else refreshState();            // staging が使えるようになった瞬間に接続状態を取り直す
  }

  function renderPower(d) {
    if (powerBusy) return;
    var s = d.state;
    powerStart.hidden = !(s === "stopped");
    powerStop.hidden = !(s === "running" && d.reachable);
    if (s === "running" && d.reachable) {
      powerDot.className = "dot connected"; powerText.textContent = "起動中"; powerNote.textContent = "";
    } else if (s === "running") {
      powerDot.className = "dot checking"; powerText.textContent = "起動中(サービスの準備中)"; powerNote.textContent = "1〜2 分で操作できるようになります";
    } else if (s === "stopped") {
      powerDot.className = "dot disconnected"; powerText.textContent = "停止中"; powerNote.textContent = "起動には 2〜3 分かかります";
    } else {
      powerDot.className = "dot checking"; powerText.textContent = (s === "stopping" ? "停止処理中" : "起動処理中"); powerNote.textContent = "";
    }
    setOffline(!(s === "running" && d.reachable));
  }

  // 電源も変化しうる間だけ追う: 起動完了(reachable)か停止で確定したら止まる。
  // 失敗も state と同じく POLL_GIVEUP 回で諦める。
  var powerTimer = null;
  var powerFails = 0;

  function powerSettled(d) {
    return (d.state === "running" && d.reachable) || d.state === "stopped" || d.state === "none";
  }

  function refreshPower() {
    clearTimeout(powerTimer);
    powerTimer = null;
    powerFails = 0;
    pollPower();
  }

  function pollPower() {
    if (powerAvailable === false) return;
    fetch("power/state", { cache: "no-store" })
      .then(function (r) {
        if (r.status === 404) { powerAvailable = false; powerCard.hidden = true; return null; }
        if (!r.ok) throw new Error("HTTP " + r.status);
        powerAvailable = true; powerCard.hidden = false;
        return r.json();
      })
      .then(function (d) {
        if (!d) return;
        powerFails = 0;
        renderPower(d);
        if (!powerSettled(d)) powerTimer = setTimeout(pollPower, POLL_MS);
      })
      .catch(function (e) {
        powerFails += 1;
        if (powerFails >= POLL_GIVEUP) {
          if (powerAvailable) {
            powerDot.className = "dot disconnected";
            powerText.textContent = "状態を取得できませんでした";
            powerNote.textContent = "サーバーが応答していません";
          }
          recheck.hidden = false;
          return;
        }
        if (powerAvailable) powerError.textContent = e.message;
        powerTimer = setTimeout(pollPower, POLL_MS);
      });
  }

  function powerAction(path, kind, doneText) {
    if (powerBusy) return;
    powerBusy = true;
    powerError.textContent = "";
    powerStart.hidden = true; powerStop.hidden = true;
    powerDot.className = "dot checking"; powerText.textContent = (kind === "power_on" ? "起動処理中" : "停止処理中"); powerNote.textContent = "";
    startProgress(kind, function () {
      powerBusy = false;
      powerCard.classList.remove("done"); void powerCard.offsetWidth; powerCard.classList.add("done");
      powerNote.textContent = doneText;
      refreshPower();  // 起動完了なら renderPower → setOffline(false) が接続状態も取り直す
    });
    post(path).catch(function (e) { stopProgress(); powerBusy = false; powerError.textContent = e.message; refreshPower(); });
  }

  powerStart.addEventListener("click", function () { powerAction("power/start", "power_on", "起動しました。下の操作が使えます"); });
  powerStop.addEventListener("click", function () { powerAction("power/stop", "power_off", "停止しました。データと IP は保持されています"); });

  recheck.addEventListener("click", function () {
    recheck.hidden = true;
    refreshPower();
    refreshState();
  });

  refreshPower();
  refreshState();
})();
</script>
</body>
</html>
