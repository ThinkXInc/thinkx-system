server {
    listen 80;
    server_name production.thinkxinc.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name production.thinkxinc.com;

    ssl_certificate     /etc/letsencrypt/live/thinkxinc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thinkxinc.com/privkey.pem;

    auth_basic           "production";
    auth_basic_user_file /etc/nginx/.htpasswd_staging;

    resolver 52.197.179.70 valid=30s;
    set $web_backend web1-stg.supercom.internal;

    location / {
        proxy_pass http://$web_backend:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
