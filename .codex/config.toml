# thinkx-system/.codex/config.toml
#
# Repository-local Codex runtime settings mapped from .claude/settings.json.
#

approval_policy = "on-request"
sandbox_mode = "workspace-write"
allow_login_shell = false

[sandbox_workspace_write]
writable_roots = []
network_access = false
exclude_tmpdir_env_var = false
exclude_slash_tmp = false

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = false
exclude = ["AWS_*", "*KEY*", "*SECRET*", "*TOKEN*", "*PASSWORD*"]

[[hooks.PostToolUse]]
matcher = "Edit|Write"

[[hooks.PostToolUse.hooks]]
type = "command"
command = '"$(git rev-parse --show-toplevel)/infra/scripts/cost-hook.sh"'
timeout = 30
statusMessage = "Checking infrastructure cost policy"
