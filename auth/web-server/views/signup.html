<!-- 仮実装: simplicity のフォーム移植までのプレースホルダ。signin.html と同型で /v1/users/create へ POST -->
<!DOCTYPE html>
<html lang="{{ lang }}">
<head><meta charset="utf-8"><title>Create account - ThinkX Account</title></head>
<body>
  <h1>Create account</h1>
  <form id="signup_form">
    <input type="email" id="email" placeholder="email" required>
    <input type="password" id="password" placeholder="password" required>
    <button type="submit">Create</button>
  </form>
  <script>
    document.getElementById('signup_form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/v1/{{ lang }}/users/create', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      if (res.ok) {
        const query = new URLSearchParams({
          service_id: '{{ service_id }}',
          redirect_uri: '{{ redirect_uri }}',
          state: '{{ state }}',
        });
        location.href = '/{{ lang }}/authorize?' + query.toString();
      } else {
        const body = await res.json();
        alert(body.message);
      }
    });
  </script>
</body>
</html>
