<!-- 仮実装: simplicity のフォーム移植 (PLAN_libcommon_simplicity.md B-2) までのプレースホルダ。
     ログイン成功後、同じ /authorize (service_id/redirect_uri/state 付き) へ戻ることで
     auth_code 発行に進む (PROTOCOL.md §2 手順2) -->
<!DOCTYPE html>
<html lang="{{ lang }}">
<head><meta charset="utf-8"><title>Sign in - ThinkX Account</title></head>
<body>
  <h1>Sign in</h1>
  <form id="signin_form">
    <input type="email" id="email" placeholder="email" required>
    <input type="password" id="password" placeholder="password" required>
    <button type="submit">Sign in</button>
  </form>
  <p><a href="/{{ lang }}/signup?service_id={{ service_id }}&redirect_uri={{ redirect_uri }}&state={{ state }}">Create account</a></p>
  <script>
    document.getElementById('signin_form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/v1/{{ lang }}/users/signin', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      if (res.ok) {
        const query = new URLSearchParams({
          service_id: '{{ service_id }}',
          redirect_uri: '{{ redirect_uri }}',
          state: '{{ state }}',
        });
        location.href = '/{{ lang }}/authorize?' + query.toString();
      } else {
        const body = await res.json();
        alert(body.message);
      }
    });
  </script>
</body>
</html>
