# 記事本文→名言/示唆抽出プロンプト
article_extract_prompt: |
  以下のテキスト全体から、名言や示唆に富む文としてXに投稿するために適した箇所を
  なるべく網羅的かつ精緻に抽出し、リストアップして出力してください。
  抽出する文の長さはXのようなSNSに適したものでかつその内容を必要十分に表現するものが望ましいです。

  出力は必ず以下の形式にしてください（区切りは ---、スコアは {{1}}〜{{5}} ）。
  1つの項目は「本文」→「{{スコア}}」の順です。余計な説明は入れないでください。

  (出力形式例)
  ---
  もしも量子力学を理解できたと思ったならば...それは量子力学を理解できていない証拠だ。
  {{3}}
  ---
  僕のおやじは制服を扱う商売をやっていたから、僕はおかげで制服を着ている人間ときていない人間の違いを、いやというほど知らされているのだ。

  つまり中身は皆同じだということだ。
  {{2}}
  ---
  人類の歴史という長い眼から、例えば今から１万年後の世界から眺めたら、１９世紀の一番顕著な事件がマクスウェルによる電磁気法則の発見であったと判断されることはほとんど間違いない。
  アメリカの南北戦争も同じ頃のこの科学上の事件に比べたら色あせて一地方の取るに足らない事件になってしまうであろう。
  {{5}}
  ---

  なお、スコアはSNSの投稿として効果的であり示唆に富みユニークであることを評価基準に
  1から5の範囲でつけてください。

# X過去投稿→再投稿に適したもの抽出・採点プロンプト（IDを返させて安全に紐付け）
xpost_filter_prompt: |
  以下のXへの過去の投稿リストから，再投稿の基準を満たす良質な投稿だけを抽出したい．
  まず，以下の排除条件を満たす投稿は除外される（出力しない）．
  ・時事的なネタ（ニュースコメント等）で、投稿時刻が変わると不自然になるものは除外。
    ただし普遍的な一般論なら可。
  ・論文の要約（タイトルとリンクがあることが多い）はすべて除外。
  ・近況報告や日常の細かな話題など、明らかに再投稿の価値のないものは除外。
  ・倫理に反するものは除外。

  残す投稿について、1〜5のスコアを付けてください。
  出力は必ず以下の形式にしてください（区切りは ---、ID行は [[id:...]]、スコアは {{1}}〜{{5}}）。
  余計な説明は入れないでください。

  (出力形式例)
  ---
  [[id:1234567891]]
  時間的に普遍なものは，必ずしも空間的に普遍であるとは言えない．それを私たちはおそらく生得的に心得ている．
  
  創造性とは
  1/
  {{3}}
  ---
  [[id:1234567890]]
  to be is to do. dubidubi du..

  - vonegut
  {{1}}
  ---
  [[id:1234567892]]
  食べ物の分子も食物マトリクスとして時間配列で吸収される。
  単純にその記号それ自体が単独で機能するのでなく文脈依存的な系列の不可分性。
  文脈自由文法の概念、長期依存文脈、遠くに配列された記号同士が関係しあうこと、をある段階で伝えることがひとつのマイルストーンになる。
  {{4}}
  ---

# 記事由来の投稿テンプレ（指定フォーマット）
post_template_article: |
  {text}

  『{article_title}』 {media_title}
  {link}
