#user  nobody;
#worker_processes  4;

error_log stderr info;
#error_log stderr debug;  # DEBUG
#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

pid /run/nginx.pid;
#daemon off;


events {
    worker_connections  1024;
}


http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=1g inactive=7d use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri$is_args$args";
    proxy_buffer_size   128k;
    proxy_buffers       16 32k;

    include       mime.types;
    default_type  application/octet-stream;

    limit_req_zone $binary_remote_addr zone=basic_rate_limit:10m rate=500r/m;
    limit_req_zone $binary_remote_addr zone=static_rate_limit:10m rate=3000r/m;
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=500r/m;
    limit_req_zone $binary_remote_addr zone=fs_rate_limit:10m rate=200r/s;
    limit_req_zone $binary_remote_addr zone=stream_rate_limit:10m rate=500r/m;

    # 全サイト共通の軽量レート制限（1 秒あたり 30 リクエスト）
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=30r/s;

    log_format ltsv "time:$time_local"
                    "\thost:$remote_addr"
                    "\tforwardedfor:$http_x_forwarded_for"
                    "\treq:$request"
                    "\tstatus:$status"
                    "\tsize:$body_bytes_sent"
                    "\treferer:$http_referer"
                    "\tua:$http_user_agent"
                    "\treqtime:$request_time"
                    "\tupsttime:$upstream_response_time"
                    "\tcache:$upstream_http_x_cache"
                    "\truntime:$upstream_http_x_runtime"
                    "\tvhost:$host"
                    "\tupstream:$upstream_addr"
                    "\tproxyhost:$proxy_host";

    log_format upstream_time '$remote_addr - $remote_user [$time_local] "$request" '
                         'upstream_response_time $upstream_response_time '
                         'upstream_connect_time $upstream_connect_time '
                         'upstream_header_time $upstream_header_time '
                         'upstream_status $upstream_status';

    #access_log stdout ltsv;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$status $request -> $proxy_host$request_uri" '
                      '$body_bytes_sent bytes "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    access_log /var/log/nginx/access.log main;
    #access_log /var/log/nginx/access.log upstream_time;
    error_log /var/log/nginx/error.log notice;
    # error_log /var/log/nginx/error.log debug;


    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    gzip  on;
    # gzip_types を書かないと nginx は text/html しか圧縮しない(既定)。
    # これが無いまま css/js が非圧縮で流れていた(main.css 117KB・2026-07-21 実測)。
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/rss+xml image/svg+xml font/ttf font/otf;
    # ここは全サイトのプロキシなので gzip_proxied が要る。既定の off は
    # 「プロキシ応答は圧縮しない」であり、これが無いと上の gzip_types も効かない。
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }


    # include all server conf files
    include conf.d/*conf;

    # NOTE: servers are to be defined in conf.d/*conf
    #server {
    #    listen       8080;
    #    server_name  localhost;

    #    #charset koi8-r;

    #    #access_log  logs/host.access.log  main;

    #    location / {
    #        root   html;
    #        index  index.html index.htm;
    #    }

    #    #error_page  404              /404.html;

    #    # redirect server error pages to the static page /50x.html
    #    #
    #    error_page   500 502 503 504  /50x.html;
    #    location = /50x.html {
    #        root   html;
    #    }
    #}
}