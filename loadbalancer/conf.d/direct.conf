# ドメインなし(EIP 直打ち)アクセス用の default_server(D-52)。
# http://{LBのEIP}/podcast/ で podcast 編集サイトを公開する。TLS なし・Basic 認証必須。
# conf.d は staging / prod 両方の LB に載る。prod 側は podcast サービス起動(Phase 4)までは
# 502 になるが Basic 認証の内側なので害はない。
# 同型の直アクセスサイトの増設は、この server に location を1つ足し web 側のポートへ振る。

server {
    listen 80 default_server;
    server_name _;
    charset utf-8;

    auth_basic           "podcast";
    auth_basic_user_file /etc/nginx/.htpasswd_podcast;

    resolver 169.254.169.253 valid=30s;
    set $web_backend web1.supercom.internal;

    location /podcast/ {
        proxy_pass http://$web_backend:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    location = /podcast { return 301 /podcast/; }

    # それ以外(IP スキャン等)には何も出さない
    location / { return 404; }
}
