server {
    listen 80;
    server_name staging.nntmapp.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name staging.nntmapp.com;

    ssl_certificate     /etc/letsencrypt/live/nntmapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nntmapp.com/privkey.pem;

    auth_basic           "staging";
    auth_basic_user_file /etc/nginx/.htpasswd_staging;

    resolver 169.254.169.253 valid=30s;
    set $web_backend web1.supercom.internal;

    location / {
        proxy_pass http://$web_backend:8005;
        proxy_set_header Host nntmapp.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
