server {
    listen 80;
    server_name staging.thinkxinc.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name staging.thinkxinc.com;

    ssl_certificate     /etc/letsencrypt/live/thinkxinc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thinkxinc.com/privkey.pem;

    auth_basic           "staging";
    auth_basic_user_file /etc/nginx/.htpasswd_staging;

    resolver 169.254.169.253 valid=30s;
    set $web_backend web1.supercom.internal;

    client_max_body_size 75m;

    # Claude 接続ページ(staging のみ・web の claude_connect.service 8008)。Basic 認証は server のものが掛かる
    location = /connect { return 301 /connect/; }
    location /connect/ {
        # 本番 web(EIP 57.182.151.177)からの中継は Basic 認証なしで通す(satisfy any = 認証 または 許可 IP)。
        # 人がブラウザで開くときは server ブロックの Basic 認証がそのまま掛かる(P トラック P-1b・2026-09-17)
        satisfy any;
        allow 57.182.151.177;
        deny all;
        # 本番反映(POST /connect/deploy)は本番の取り込みを 75 秒待ってから応答する。既定 60 秒だと 504 の HTML が返り
        # 画面が「Unexpected token '<'」になる(2026-09-17 実測)
        proxy_read_timeout 300s;
        proxy_pass http://$web_backend:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://$web_backend:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
