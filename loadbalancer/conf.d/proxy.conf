server {
    listen 443 ssl;
    server_name nntm.thinkxinc.com;

    client_max_body_size 75M;

    # ssl_certificate /etc/ssl/certs/thinkxinc.com.crt;
    # ssl_certificate_key /etc/ssl/private/thinkxinc.com.key;
    ssl_certificate /etc/letsencrypt/live/thinkxinc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thinkxinc.com/privkey.pem;

    location / {
        rewrite ^/(?!nntm)(.*)$ /nntm/$1 last;
        # GET /about → becomes /nntm/about
        # GET /api/v1 → becomes /nntm/api/v1
        # GET /nntm/whatever → no rewrite because it already starts with /nntm

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://web1.supercom.internal:8005;
        # same as above, or handle subdomain if needed
    }
}

