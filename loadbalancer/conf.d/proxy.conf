server {

    set $backend_quantz "web1.supercom.internal:8000"; # Backend for quantz.thinkxinc.com
    set $stream_quantz "192.168.1.9:8001";   # Stream service for quantz
    set $files_quantz "192.168.1.7:8009";  # File server for quantz (/disk1/quantz)

    set $backend_experiment "192.168.1.21:8000"; # "192.168.1.7:8000";  # Backend for experiment.thinkxinc.com
    set $stream_experiment "192.168.1.7:8001";    # Stream service for experiment

    #set $cache_enabled 0;  # 1 for enabled, 0 for disabled  # NOTE: NOT WORKING. see location /img/ part

    listen 443 ssl;
    server_name quantz.thinkxinc.com;

    client_max_body_size 75M;

    # ssl_certificate /etc/ssl/certs/thinkxinc.com.crt;
    # ssl_certificate_key /etc/ssl/private/thinkxinc.com.key;
    ssl_certificate /etc/letsencrypt/live/thinkxinc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thinkxinc.com/privkey.pem;

    # website
    location / {
        limit_req zone=basic_rate_limit burst=500 nodelay;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;

        proxy_pass http://$backend_quantz;
        #proxy_pass $backend_scheme://$backend_host;
        # NOTE: `if` in location can cause override other location
        #if ($host ~* ^experiment\.thinkxinc\.com$) {
        #    proxy_pass http://$backend_experiment;
        #}

        #if ($host ~* ^quantz\.thinkxinc\.com$) {
        #    proxy_pass http://$backend_quantz;
        #}
    }

    # main server
    location /stream/ {
        limit_req zone=stream_rate_limit burst=500 nodelay;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;

        proxy_pass http://$stream_quantz; # Stream service
        # NOTE: `if` in location can cause override other location
        #if ($host ~* ^experiment\.thinkxinc\.com$) {
        #    proxy_pass http://$stream_experiment; # Stream service
        #}

        #if ($host ~* ^quantz\.thinkxinc\.com$) {
        #    proxy_pass http://$stream_quantz; # Stream service
        #}
    }

    # file server
    location /fs/ {
        limit_req zone=fs_rate_limit burst=500 nodelay;

        client_max_body_size 100M;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_pass http://$files_quantz;
    }

    # web server api
    location /v1/ {
        limit_req zone=api_rate_limit burst=500 nodelay;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;

        proxy_pass http://$backend_quantz;
        #proxy_pass $backend_scheme://$backend_host;
        # NOTE: `if` in location can cause override other location
        #if ($host ~* ^experiment\.thinkxinc\.com$) {
        #    proxy_pass http://$backend_experiment;
        #}

        #if ($host ~* ^quantz\.thinkxinc\.com$) {
        #    proxy_pass http://$backend_quantz;
        #}
    }

    # web server static
    location /img/ {
        limit_req zone=static_rate_limit burst=3000 nodelay;

        proxy_pass http://$backend_quantz;
        #proxy_pass $backend_scheme://$backend_host;
        # NOTE: `if` in location can cause override other location
        #if ($host ~* ^experiment\.thinkxinc\.com$) {
        #    proxy_pass http://$backend_experiment;
        #}

        #if ($host ~* ^quantz\.thinkxinc\.com$) {
        #    proxy_pass http://$backend_quantz;
        #}

        ## Cache enable mode
        #proxy_cache static_cache;
        #proxy_cache_valid 200 30d;  # Cache successful responses for 30 days
        #proxy_cache_valid 404 10m;  # Cache 404 responses for 10 minutes
        #proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        #proxy_cache_lock on;
        #add_header X-Cache-Status $upstream_cache_status;
        #expires 7d;
        #add_header Cache-Control "public, max-age=2592000";

        # Cache disable mode
        expires -1;  # Disables caching by setting expiration headers in the past
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";  # Ensures older HTTP/1.0 caches also do not store it
    }

    # file server

    location /video/ {
        limit_req zone=static_rate_limit burst=1000 nodelay;

        proxy_pass http://$backend_quantz;
        #proxy_pass $backend_scheme://$backend_host;
        # NOTE: `if` in location can cause override other location
        #if ($host ~* ^experiment\.thinkxinc\.com$) {
        #    proxy_pass http://$backend_experiment;
        #}

        #if ($host ~* ^quantz\.thinkxinc\.com$) {
        #    proxy_pass http://$backend_quantz;
        #}

        proxy_cache static_cache;
        proxy_cache_valid 200 7d;  # Cache successful responses for 7 days
        #proxy_cache_valid 200 30d;  # Cache successful responses for 30 days
        proxy_cache_valid 404 10m;  # Cache 404 responses for 10 minutes
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;

        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }


}
