server {
    listen 80;
    server_name thinkxinc.com www.thinkxinc.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name thinkxinc.com;

    client_max_body_size 75M;

    # ssl_certificate /etc/ssl/certs/thinkxinc.com.crt;
    # ssl_certificate_key /etc/ssl/private/thinkxinc.com.key;
    ssl_certificate /etc/letsencrypt/live/thinkxinc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thinkxinc.com/privkey.pem;

    location / {
        proxy_pass http://web1.supercom.internal:8005; 
        # etc. (proxy headers, keepalive, etc.)
    }
}

server {
    listen 80;
    server_name nntmapp.com www.nntmapp.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name nntmapp.com www.nntmapp.com;  # Include www if needed

    # SSL certificate paths (update these based on Certbot output)
    ssl_certificate /etc/letsencrypt/live/nntmapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nntmapp.com/privkey.pem;

    client_max_body_size 75M;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;

        proxy_pass http://web1.supercom.internal:8005;  # Adjust to your backend server
    }
}

