# uwsgi.ini — podcast 編集サイトの起動設定。
# 起動: web-server/venv/bin/uwsgi --ini web-server/uwsgi/uwsgi.ini
# 本番は uwsgi_podcast.service が絶対パスで読む（他サイトと同じ型）。

[uwsgi]
# nginx と繋ぐ Unix ソケット（nginx/conf.d/podcast.conf と一致させる）
socket = /tmp/uwsgi_podcast.sock
pidfile = /tmp/uwsgi_podcast.pid
chmod-socket = 666
# application root（service の WorkingDirectory = web-server からの相対）
chdir = ../web-server
# 専用 venv（application root からの相対）
venv = ./venv
# アプリは /podcast/ 配下で公開する。manage-script-name で SCRIPT_NAME を
# uWSGI が剥がすので、main.py 側は自分のプレフィックスを知らなくてよい
mount = /podcast=main.py
manage-script-name = true
callable = app
master = true
processes = 2
threads = 2
vacuum = true
# staging はテンプレート・コード編集の即反映に使う（他サイトと同じ運用）
py-autoreload = 1
# 保存ペイロードは小さいが、余裕を持って他サイトと同じ上限にする
limit-post = 70000000
buffer-size = 8192
die-on-term = true
