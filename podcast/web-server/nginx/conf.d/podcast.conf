# podcast 編集サイトの nginx 設定。nginx-web-root が絶対パスで include する。
# ポート・socket は他サイトと衝突しない値（thinkx=8005 / transformism=8006 /
# kazukiotsukacom=8007 / podcast=8010）。
# サイトは /podcast/ 配下で公開する（LB が http://{EIP}/podcast/ をここへ渡す。
# 同型の直アクセスサイトを location 追加で増設できる前提 — D-52）。
# プレフィックスは uwsgi 側の mount + manage-script-name が剥がす。

upstream podcast_uwsgi {
    server unix:/tmp/uwsgi_podcast.sock;
}

server {
    listen 8010;
    server_name _;
    charset utf-8;
    client_max_body_size 75M;

    location = /podcast { return 301 /podcast/; }

    # 動的ページ（一覧・IDページ・保存・書き出し）→ uWSGI
    location /podcast/ {
        include uwsgi_params;
        uwsgi_pass podcast_uwsgi;
    }

    # 生成物（音源・動画）は data/ を直接配信する（アプリを通さない。コピーしない）
    location /podcast/media/ {
        alias /src/podcast/data/;
        add_header Accept-Ranges bytes;
    }
}
